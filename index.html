<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="School Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF8F3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>School Hub</title>
<style>
:root{
  --bg:#FBF8F3; --card:#FFFFFF; --ink:#2B2A33; --muted:#7A7685; --line:#EFEAE2; --soft:#F5F1EA;
  --accent:#2B2A33; --red:#B7791F; --redbg:#FBF0DC; --amber:#A8650C; --amberbg:#FFF1D6;
  --green:#2E9E6B; --shadow:0 1px 2px rgba(43,42,51,.04),0 6px 18px rgba(43,42,51,.06);
  --t1:#FFF1D6; --t2:#E3F4EE; --t3:#E6EEFB;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16151B; --card:#211F28; --ink:#F2EFEA; --muted:#A6A1B0; --line:#302D39; --soft:#2A2732;
    --accent:#F2EFEA; --redbg:#3A2F17; --red:#E2B068; --amberbg:#3A2F17; --amber:#F2C27A; --shadow:none;
    --t1:#3A2F17; --t2:#1D332B; --t3:#1F2A3D; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* Header */
.hero{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 4px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.brand .lg{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--soft);font-size:15px}
.hello{margin:12px 0 2px;font-size:25px;font-weight:800;letter-spacing:-.4px}
.upd{font-size:12.5px;color:var(--muted)}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;border-radius:16px;padding:10px 12px}
.stat:nth-child(1){background:var(--t1)} .stat:nth-child(2){background:var(--t2)} .stat:nth-child(3){background:var(--t3)}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

/* Kid switcher */
.kids{display:flex;gap:8px;margin:14px 0 4px;padding:2px 0 6px}
.kid{flex:1 1 0;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:16px;
  padding:8px;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;position:relative}
.kid.on{border-color:var(--kc);background:color-mix(in srgb, var(--kc) 12%, var(--card))}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:0 0 auto}
.av.sm{width:22px;height:22px;font-size:11px}
.kid > span:nth-child(2){min-width:0}
.kid .nm{font-weight:800;font-size:14px;line-height:1.15;white-space:nowrap}
.kid .gr{font-size:11px;color:var(--muted);white-space:nowrap}
.kid .badge{position:absolute;top:-7px;right:-5px;background:var(--ink);color:var(--bg);border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px;border:2px solid var(--bg)}

/* Sections & cards */
section{margin-top:20px}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
h2 .count{background:var(--ink);color:var(--bg);border-radius:999px;padding:0 8px;font-size:12px}
h2 .sub{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.card{background:var(--card);border-radius:18px;padding:14px 14px 14px 18px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card.kidline::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--kc)}
.who{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px 2px 3px;font-size:12px;font-weight:700;white-space:nowrap}
.who .tag{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.ttl{font-weight:700;font-size:15.5px;line-height:1.3}
.row{display:flex;gap:12px;align-items:flex-start}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid #D6D0C6;flex:0 0 auto;cursor:pointer;display:grid;place-items:center;background:transparent;margin-top:1px}
.chk.on{background:var(--green);border-color:var(--green)}
.chk.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done .ttl{text-decoration:line-through;color:var(--muted)}
.done{opacity:.7}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px;font-size:12.5px;color:var(--muted)}
.due{font-weight:800;border-radius:8px;padding:2px 8px;font-size:12px}
.due.now{background:var(--redbg);color:var(--red)} .due.soon{background:var(--t3);color:#3F6DB3} .due.later{background:var(--soft);color:var(--muted)}
.opt{font-size:10.5px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;letter-spacing:.3px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:12px;background:var(--accent);color:var(--bg);text-decoration:none;font-size:13px;font-weight:700;border:0;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn svg{width:15px;height:15px}

/* Agenda */
.day{margin-bottom:14px}
.dayhead{display:flex;align-items:center;gap:10px;margin:4px 2px 8px}
.datebox{width:44px;text-align:center;background:var(--card);border-radius:12px;padding:4px 0;box-shadow:var(--shadow)}
.datebox .m{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.datebox .d{font-size:18px;font-weight:800;line-height:1.1}
.dayhead .dn{font-weight:700}
.dayhead .rel{color:var(--muted);font-size:12.5px}
.busy{font-size:11px;font-weight:800;color:var(--amber);background:var(--amberbg);border-radius:6px;padding:1px 7px;margin-left:auto}
.time{font-size:12.5px;font-weight:800;color:var(--muted)}
.cond{font-size:11px;font-weight:800;color:var(--amber);background:var(--amberbg);border-radius:6px;padding:1px 7px}
.past{opacity:.5}

/* Messages */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg{cursor:pointer}
.summary{margin-top:6px;opacity:.88}
.more{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.msg.open .more{display:block}
.more ul{margin:0 0 8px;padding-left:18px}
.more li{margin:4px 0}
.lbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 4px}
.links a{display:block;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:700;margin:5px 0;word-break:break-word}
.small{font-size:12.5px;color:var(--muted)}
.small a{color:var(--ink)}
.chev{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:8px}
.msg.open .chev{display:none}
.hi{font-size:10.5px;font-weight:800;color:var(--red);background:var(--redbg);border-radius:6px;padding:1px 7px}
.empty{color:var(--muted);text-align:center;padding:22px 0;font-size:14px}
.empty .e{font-size:30px;display:block;margin-bottom:4px}
.toggle{background:none;border:0;color:var(--ink);text-decoration:underline;font-weight:700;font-size:13.5px;cursor:pointer;padding:6px 0}

/* Bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:6}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--ink)}

/* Lock */
#lock{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);align-items:center;justify-content:center;padding:24px}
#lockform{width:100%;max-width:330px;background:var(--card);border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:var(--shadow)}
#lockform h1{margin:0;font-size:24px}
#lockform input[type=password]{font-size:17px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.logo{font-size:44px}
</style>
</head>
<body>
<div id="lock"><form id="lockform">
  <div class="logo">🎒</div><h1>School Hub</h1>
  <div class="small">Enter your password to open</div>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
  <label class="small"><input type="checkbox" id="remember" checked> Remember on this phone</label>
  <button class="btn" type="submit" style="justify-content:center;padding:13px">Open</button>
  <div id="lockerr" class="small" style="color:var(--red);min-height:18px"></div>
</form></div>

<div class="hero">
  <div class="brand"><span class="lg">🎒</span>School Hub · GIA</div>
  <div class="hello" id="hello">Hello</div>
  <div class="upd" id="updated"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="wrap">
  <div class="kids" id="kids"></div>
  <main id="view"></main>
</div>

<nav><div class="in">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>To do</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Calendar</button>
  <button data-tab="msgs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>Messages</button>
</div></nav>

let KIDS = [];
const PALETTE = [{c:"#5B8DD6"},{c:"#4FA38A"},{c:"#A98BCB"},{c:"#C9A04E"}];  // calm sky blue, sage green, soft lilac, sand
const SCHOOL = {name:"All", label:"Whole school", grade:"", color:"#8C8A99", pastel:"#EEF0F4", initial:"🏫"};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} } };
const state = { kid: "All", tab: "home", cat: "All", done: new Set(JSON.parse(store.get("sh_done") || "[]")), showPast: false };
const NOW = new Date();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kidOf = n => KIDS.find(k => k.name === n) || SCHOOL;
const parse = s => s ? new Date(s.length === 10 ? s + "T00:00" : s) : null;
const hasTime = s => s && s.length > 10;
const pad = n => String(n).padStart(2,"0");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const daysFromToday = d => Math.round((startOfDay(d) - startOfDay(NOW)) / 864e5);
const fmtTime = d => d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const fmtDay = d => d.toLocaleDateString([], {weekday:"long", month:"short", day:"numeric"});
function relDay(d){ const n = daysFromToday(d);
  if (n === 0) return "Today"; if (n === 1) return "Tomorrow"; if (n === -1) return "Yesterday";
  if (n < 0) return Math.abs(n) + " days ago"; return "in " + n + " days"; }

const CAT_ICON = {
  "Class & Academics":"📚", "After-School Activities (ASA)":"🎨", "Arts & Performances":"🎭", "Sports":"⚽",
  "Events & Trips":"🚌", "Parents & Board":"🏫", "Admin, Fees & Forms":"📝", "Health & Safety":"🩺"
};
const catIcon = c => CAT_ICON[c] || "📌";

function kidsOf(child){ return (Array.isArray(child) ? child : [child || "All"]); }
function matchKid(child){
  if (state.kid === "All") return true;
  const arr = kidsOf(child);
  return arr.includes(state.kid) || arr.includes("All");
}
function avatar(k, sm){
  return `<span class="av ${sm?"sm":""}" style="background:${k.color}">${k.initial || esc(k.name[0])}</span>`;
}
// "who" line: avatar(s) + name + class/grade + activity tag
function who(child, email){
  const ks = kidsOf(child).map(kidOf);
  const uniq = [...new Map(ks.map(k => [k.name, k])).values()];
  const tag = email ? (email.x.group || email.x.category) : "";
  return `<div class="who">${uniq.map(k => `<span class="pill" style="background:color-mix(in srgb, ${k.color} 15%, transparent);color:${k.color}">${avatar(k, true)}${esc(k.name === "All" ? "Whole school" : k.name)}${k.grade ? " · " + esc(k.grade) : ""}</span>`).join("")}
    ${tag ? `<span class="tag">${catIcon(email.x.category)} ${esc(tag)}</span>` : ""}</div>`;
}
const kidColor = child => { const ks = [...new Set(kidsOf(child))].map(kidOf); return ks.length === 1 ? ks[0].color : `linear-gradient(${ks.map(k => k.color).join(",")})`; };

// Flatten data
const ACTIONS = [], EVENTS = [];
function init(){
  KIDS = DATA.config.children.map((k, i) => ({...k, color: PALETTE[i % 4].c, pastel: PALETTE[i % 4].p, initial: k.name[0]}));
  DATA.emails.forEach(e => {
    (e.x.actions || []).forEach((a, i) => ACTIONS.push({...a, id: e.id + "-a" + i, email: e}));
    (e.x.events || []).forEach((v, i) => EVENTS.push({...v, id: e.id + "-e" + i, email: e}));
  });
}

const openActions = () => ACTIONS.filter(a => !state.done.has(a.id) && !(a.due && hasTime(a.due) && parse(a.due) < NOW && daysFromToday(parse(a.due)) < 0));
const upcoming = () => EVENTS.filter(v => matchKid(v.child) && (parse(v.end) || parse(v.start)) >= startOfDay(NOW));

function renderHeader(){
  const h = NOW.getHours();
  $("#hello").textContent = (h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening") + " 👋";
  const todo = openActions().filter(a => !a.optional && matchKid(a.child)).length;
  const week = upcoming().filter(v => daysFromToday(parse(v.start)) <= 7).length;
  const today = upcoming().filter(v => daysFromToday(parse(v.start)) === 0).length;
  $("#stats").innerHTML = `<div class="stat"><b>${todo}</b><span>to do</span></div>
    <div class="stat"><b>${today}</b><span>today</span></div>
    <div class="stat"><b>${week}</b><span>this week</span></div>`;
}

function renderKids(){
  const opts = [{name:"All", label:"All", grade:"Both kids", color:"#6B6478", initial:"★"}].concat(KIDS);
  $("#kids").innerHTML = opts.map(k => {
    const n = k.name === "All" ? openActions().filter(a => !a.optional).length
      : openActions().filter(a => !a.optional && kidsOf(a.child).some(c => c === k.name || c === "All")).length;
    return `<button class="kid ${state.kid===k.name?"on":""}" data-kid="${k.name}" style="--kc:${k.color}">
      ${avatar(k)}<span><div class="nm">${esc(k.label || k.name)}</div><div class="gr">${esc(k.grade)}</div></span>
      ${n ? `<span class="badge">${n}</span>` : ""}</button>`;
  }).join("");
}

function dueBadge(s){
  const d = parse(s); if (!d) return "";
  const n = daysFromToday(d);
  const cls = n <= 1 ? "now" : n <= 4 ? "soon" : "later";
  const label = n < 0 ? "Overdue" : "Due " + relDay(d).replace(/^in /, "in ") + (hasTime(s) ? ", " + fmtTime(d) : "");
  return `<span class="due ${cls}">${esc(label)}</span>`;
}

const ICON_CAL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18M12 13v5M9.5 15.5h5"/></svg>`;
const ICON_OUT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>`;

function actionCard(a){
  const done = state.done.has(a.id);
  const isMail = a.link && a.link.startsWith("mailto:");
  return `<div class="card kidline ${done?"done":""}" style="--kc:${kidColor(a.child)}">
    ${who(a.child, a.email)}
    <div class="row">
      <div class="chk ${done?"on":""}" data-done="${a.id}" role="checkbox" aria-checked="${done}" title="Mark done"></div>
      <div style="flex:1;min-width:0">
        <div class="ttl">${esc(a.text)} ${a.optional?'<span class="opt">OPTIONAL</span>':""}</div>
        <div class="meta">${dueBadge(a.due)}</div>
        ${a.link && !done ? `<div class="btns"><a class="btn" href="${esc(a.link)}" target="_blank" rel="noopener">${ICON_OUT}${isMail?"Write the email":"Open form / link"}</a></div>` : ""}
      </div>
    </div></div>`;
}

function evCard(v){
  const s = parse(v.start), e = parse(v.end);
  const past = (e || s) < NOW && !(daysFromToday(s) === 0 && !hasTime(v.start));
  const when = hasTime(v.start) ? fmtTime(s) + (hasTime(v.end) ? " – " + fmtTime(e) : "") : "All day";
  return `<div class="card kidline ${past?"past":""}" style="--kc:${kidColor(v.child)}">
    ${who(v.child, v.email)}
    <div class="time">${esc(when)}</div>
    <div class="ttl">${esc(v.title)}</div>
    <div class="meta">${v.conditional?`<span class="cond">${esc(v.conditional)}</span>`:""}${v.location?`<span>📍 ${esc(v.location)}</span>`:""}</div>
    ${v.notes?`<div class="meta">${esc(v.notes)}</div>`:""}
    <div class="btns">
      <button class="btn" data-ics="${v.id}">${ICON_CAL}Add to my calendar</button>
      ${v.link?`<a class="btn ghost" href="${esc(v.link)}" target="_blank" rel="noopener">${ICON_OUT}Open link</a>`:""}
    </div>
  </div>`;
}

function agenda(events){
  const groups = {};
  events.forEach(v => { const k = dayKey(parse(v.start)); (groups[k] = groups[k] || []).push(v); });
  return Object.keys(groups).sort().map(k => {
    const d = parse(k), list = groups[k].sort((a,b) => a.start.localeCompare(b.start));
    const busy = list.length + openActions().filter(a => a.due && dayKey(parse(a.due)) === k && matchKid(a.child)).length >= 3;
    return `<div class="day"><div class="dayhead">
        <div class="datebox"><div class="m">${d.toLocaleDateString([], {month:"short"})}</div><div class="d">${d.getDate()}</div></div>
        <div><div class="dn">${fmtDay(d).split(",")[0]}</div><div class="rel">${relDay(d)}</div></div>
        ${busy?'<span class="busy">BUSY DAY</span>':""}</div>
      ${list.map(evCard).join("")}</div>`;
  }).join("");
}

const empty = (emoji, text) => `<div class="card empty"><span class="e">${emoji}</span>${text}</div>`;

function viewHome(){
  const todos = ACTIONS.filter(a => matchKid(a.child))
    .filter(a => !(a.due && parse(a.due) < new Date(NOW - 7*864e5)))
    .sort((a,b) => (state.done.has(a.id) - state.done.has(b.id)) || (a.optional - b.optional) || String(a.due || "9").localeCompare(String(b.due || "9")));
  const open = todos.filter(a => !state.done.has(a.id) && !a.optional).length;
  const thisWeek = upcoming().filter(v => daysFromToday(parse(v.start)) <= 7);
  return `<section><h2>Needs your action ${open?`<span class="count">${open}</span>`:""}<span class="sub">tap ☐ when done</span></h2>
      ${todos.length ? todos.map(actionCard).join("") : empty("🎉", "Nothing to do right now")}</section>
    <section><h2>Coming up this week</h2>${thisWeek.length ? agenda(thisWeek) : empty("🌤️", "Nothing scheduled this week")}</section>`;
}

function viewCal(){
  const up = upcoming();
  const past = EVENTS.filter(v => matchKid(v.child) && !up.includes(v));
  return `<section><h2>Upcoming <span class="sub">tap “Add to my calendar” for the ones you want</span></h2>
      ${up.length ? agenda(up) : empty("📅", "Nothing upcoming")}</section>
    ${past.length ? `<section><button class="toggle" data-past="1">${state.showPast?"Hide":"Show"} past events (${past.length})</button>
      ${state.showPast ? agenda(past) : ""}</section>` : ""}`;
}

function viewMsgs(){
  const emails = DATA.emails.filter(e => matchKid(e.x.children));
  const cats = ["All", ...new Set(emails.map(e => e.x.category))];
  const list = emails.filter(e => state.cat === "All" || e.x.category === state.cat).sort((a,b) => b.date.localeCompare(a.date));
  return `<section><h2>School emails <span class="sub">${list.length} message${list.length===1?"":"s"}</span></h2>
    <div class="chips">${cats.map(c => `<button class="chip ${state.cat===c?"on":""}" data-cat="${esc(c)}">${c==="All"?"All":catIcon(c)+" "+esc(c)}</button>`).join("")}</div>
    ${list.map(e => `<div class="card kidline msg" data-msg="${e.id}" style="--kc:${kidColor(e.x.children)}">
        ${who(e.x.children, e)}
        <div class="ttl">${esc(e.x.title)} ${e.x.importance==="high"?'<span class="hi">IMPORTANT</span>':""}</div>
        <div class="small">${new Date(e.date).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"})} · from ${esc(e.from_name)}</div>
        <div class="summary">${esc(e.x.summary)}</div>
        <div class="chev">Show details ›</div>
        <div class="more">
          ${(e.x.key_points||[]).length?`<div class="lbl">Key points</div><ul>${e.x.key_points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
          ${(e.x.links||[]).length?`<div class="lbl">Links</div><div class="links">${e.x.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>`:""}
          ${(e.x.contacts||[]).length?`<div class="lbl">Contacts</div>${e.x.contacts.map(c=>`<div class="small">${esc(c.name)} · ${esc(c.role)} · <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>`).join("")}`:""}
          <div class="lbl">Original email</div><div class="small">“${esc(e.subject)}”<br>${new Date(e.date).toLocaleString()}</div>
        </div>
      </div>`).join("") || empty("📭", "No messages")}</section>`;
}

// ---------- Calendar (.ics) ----------
const utc = d => `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
const icsText = s => String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g, m => "\\" + m);
function local(s){ return new Date(s + (s.length === 10 ? "T00:00" : "") + ":00" + DATA.config.utc_offset); }
function vevent(v){
  const ks = kidsOf(v.child).map(kidOf);
  const label = ks.map(k => k.name === "All" ? "GIA" : k.name).join(" & ");
  let when;
  if (hasTime(v.start)) {
    const s = local(v.start), e = v.end && hasTime(v.end) ? local(v.end) : new Date(s.getTime() + 36e5);
    when = `DTSTART:${utc(s)}\r\nDTEND:${utc(e)}`;
  } else {
    const d = v.start.replace(/-/g,""), n = new Date(v.start + "T12:00"); n.setDate(n.getDate()+1);
    when = `DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${n.getFullYear()}${pad(n.getMonth()+1)}${pad(n.getDate())}`;
  }
  const desc = [v.notes, v.conditional ? "(" + v.conditional + ")" : "", v.link || "", "From: " + v.email.subject].filter(Boolean).join("\n");
  return `BEGIN:VEVENT\r\nUID:${v.id}@schoolhub\r\nDTSTAMP:${utc(new Date())}\r\n${when}\r\nSUMMARY:${icsText("[" + label + "] " + v.title)}\r\n` +
    (v.location ? `LOCATION:${icsText(v.location)}\r\n` : "") + `DESCRIPTION:${icsText(desc)}\r\nTRANSP:TRANSPARENT\r\n` +
    `BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsText(v.title)}\r\nTRIGGER:${hasTime(v.start) ? "-PT1H" : "-PT15H"}\r\nEND:VALARM\r\nEND:VEVENT\r\n`;
}
function downloadIcs(events, name){
  const body = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//School Hub//EN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n" + events.map(vevent).join("") + "END:VCALENDAR\r\n";
  const url = URL.createObjectURL(new Blob([body], {type: "text/calendar;charset=utf-8"}));
  const a = document.createElement("a"); a.href = url; a.download = name + ".ics";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function render(){
  renderHeader();
  renderKids();
  $("#view").innerHTML = state.tab === "home" ? viewHome() : state.tab === "cal" ? viewCal() : viewMsgs();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-kid],[data-tab],[data-done],[data-cat],[data-msg],[data-ics],[data-past],a");
  if (!t || t.tagName === "A") return;
  if (t.dataset.kid) { state.kid = t.dataset.kid; state.cat = "All"; }
  else if (t.dataset.tab) { state.tab = t.dataset.tab; window.scrollTo(0,0); }
  else if (t.dataset.done) { state.done.has(t.dataset.done) ? state.done.delete(t.dataset.done) : state.done.add(t.dataset.done); store.set("sh_done", JSON.stringify([...state.done])); }
  else if (t.dataset.cat) state.cat = t.dataset.cat;
  else if (t.dataset.ics) { const v = EVENTS.find(x => x.id === t.dataset.ics); downloadIcs([v], v.title.replace(/[^\w]+/g,"_")); return; }
  else if (t.dataset.past) state.showPast = !state.showPast;
  else if (t.dataset.msg) { t.classList.toggle("open"); return; }
  render();
});

function start(){
  init();
  $("#lock").style.display = "none";
  $("#updated").textContent = NOW.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"}) + " · updated " + new Date(DATA.generated).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  render();
}

// ---------- Password lock ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function tryUnlock(pw, remember){
  try { DATA = await unlock(pw); if (remember) store.set("sh_pw", pw); start(); }
  catch(e) { store.set("sh_pw", null); $("#lockerr").textContent = "Wrong password, try again."; }
}
if (!ENC) start();
else {
  $("#lock").style.display = "flex";
  const saved = store.get("sh_pw");
  if (saved) tryUnlock(saved, true);
  $("#lockform").addEventListener("submit", ev => { ev.preventDefault(); $("#lockerr").textContent = "Unlocking…"; tryUnlock($("#pw").value, $("#remember").checked); });
}
</script>
